<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<!-- סגנון 2: השאלה המקורית מדף הבגרות עם מרקר, לוח שנכתב לאט, שברים אמיתיים -->
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Secular One";src:url(SecularOne.ttf)}
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;overflow:hidden;font-family:Rubik,Arial,sans-serif;color:#1d2a6b;
background:#fdfcf8;background-image:linear-gradient(#e8ecf3 1px,transparent 1px),linear-gradient(90deg,#e8ecf3 1px,transparent 1px);background-size:36px 36px}
.brand{position:absolute;left:24px;bottom:18px;display:flex;align-items:center;gap:12px;background:#141b3a;border-radius:14px;padding:8px 18px 8px 10px;box-shadow:0 6px 18px #141b3a33}
.brand img{width:44px;height:44px;border-radius:10px}
.brand span{font-family:"Secular One";font-size:25px;color:#ffd77a}
.brand small{display:block;font-size:15px;color:#c9cfe6;margin-top:-3px}
#rc{position:absolute;right:20px;top:18px;bottom:18px;width:900px;display:flex;flex-direction:column;gap:14px}
#qp{background:#fff;border:1px solid #e3e6ee;border-radius:14px;box-shadow:0 4px 20px #0001;overflow:hidden;flex:0 0 auto}
#qp .h{background:#141b3a;color:#ffd77a;font-size:19px;font-weight:700;padding:10px 18px;display:flex;align-items:center;gap:10px}
#qp .h img{width:26px;height:26px;border-radius:6px}
#qw{position:relative;overflow:hidden;margin:8px auto}
#qw img{position:absolute;left:0;top:0;transform-origin:0 0}
.mk{position:absolute;background:#ffe34d;mix-blend-mode:multiply;border-radius:6px;opacity:.85}
.mk.o{background:#ffb37a}
.mk.g{background:#9be7b5}
#fig{display:block;margin:0 auto}
#fw{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0}
#main{position:absolute;right:946px;left:30px;top:22px;bottom:92px;overflow:hidden}
#main h2{display:inline-block;color:#c8242f;font-size:38px;font-weight:700;border-bottom:3px solid #c8242f;padding-bottom:4px;margin-bottom:14px}
#bd{position:absolute;top:80px;left:0;right:0;bottom:0;overflow:hidden}
#ls{position:absolute;right:0;left:0;top:0}
.ln{display:table;font-size:33px;line-height:1.55;margin:2px 0 12px;color:#1d3f9a;max-width:100%}
.ln.old{opacity:.55}
.ln.k{color:#1d2a6b;font-weight:700}
.ln.data{color:#1d2a6b}
.ln.data .lb{color:#c8242f;font-weight:700;margin-left:8px}
.lb{color:#c8242f;font-weight:700;margin-left:6px}
.ln.g{color:#16824f;font-weight:700}
.ln.box .bx{display:inline-block;border:3px solid #c8242f;border-radius:10px;padding:2px 16px;color:#1d2a6b;font-weight:700;background:#fff}
.ln.tip{color:#1d6b8a;font-size:30px;background:#eaf6fb;border-radius:10px;padding:4px 14px}
.ln.why{color:#7a4a00;font-size:30px;background:#fff6dc;border-right:5px solid #f5b83d;border-radius:8px;padding:4px 14px}
.ln.rule{background:#141b3a;color:#ffd77a;font-weight:700;border-radius:12px;padding:6px 18px;font-size:29px}
.ln.ask{background:#e9f8ef;color:#16824f;font-weight:700;border-radius:12px;padding:6px 18px;font-size:30px;border:2px dashed #16824f}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;vertical-align:middle}
.hm{background:linear-gradient(transparent 12%,#ffe34d 12%,#ffe34d 88%,transparent 88%);border-radius:4px;padding:0 3px}
.ho{background:linear-gradient(transparent 12%,#ffc9a3 12%,#ffc9a3 88%,transparent 88%);border-radius:4px;padding:0 3px}
.hg{background:linear-gradient(transparent 12%,#bdf0cf 12%,#bdf0cf 88%,transparent 88%);border-radius:4px;padding:0 3px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px;line-height:1.15}
.fr>span:first-child{border-bottom:2.5px solid currentColor;padding:0 6px 2px}
.fr>span:last-child{padding:2px 6px 0}
.sq{display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap}
.sq>i{font-style:normal;font-size:1.15em;line-height:1}
.sq>span{border-top:2.5px solid currentColor;padding:0 4px;margin-top:4px}
sup,sub{font-size:.65em}
#cover{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,#26336a,#141b3a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#cover[hidden]{display:none}
#cover img{width:170px;height:170px;border-radius:36px;box-shadow:0 10px 40px #0006;margin-bottom:22px}
#cover .nm{font-family:"Secular One";font-size:58px;color:#ffd77a}
#cover .s1{font-size:34px;color:#c9cfe6;margin-top:26px}
#cover .s2{font-size:96px;font-weight:700;margin:6px 0;border-bottom:5px solid #f5b83d;padding-bottom:4px}
#cover .s3{font-size:34px;color:#c9cfe6;max-width:1300px;text-align:center;line-height:1.5}
</style></head><body>
<div id="main"><h2 id="hh"></h2><div id="bd"><div id="ls"></div></div></div>
<div id="rc"><div id="qp"><div class="h"><img src="logo.svg"><span id="qh"></span></div><div id="qw"><img id="qi"></div></div><div id="fw"><svg id="fig"></svg></div></div>
<div class="brand"><img src="logo.svg"><div><span>פשוט להצליח במתמטיקה</span><small>אוראל פנחסי · בגרות במתמטיקה</small></div></div>
<div id="cover" hidden></div>
<script src="figs.js"></script>
<script>
// S: {cover} | {qh, img:{src,crop:[x,y,w,h]}, mk:[[x,y,w,h,cls]...], h, fig, lines:[{c,t}], prog, keep}
let curSrc='';
window.render=async function(S){
  const C=document.getElementById('cover');
  if(S.cover){C.hidden=false;C.innerHTML=`<img src="logo.svg"><div class="nm">פשוט להצליח במתמטיקה</div><div class="s1">${S.cover[0]}</div><div class="s2">${S.cover[1]}</div><div class="s3">${S.cover[2]||''}</div>`;return}
  C.hidden=true;
  document.getElementById('qh').textContent=S.qh;
  // figure first (it takes the space under the question)
  const G=document.getElementById('fig'),FW=document.getElementById('fw');
  let fh=0;
  if(S.fig){const [W,H,s]=S.fig.type==='bell'?bell(S.fig):S.fig.type==='tree'?tree(S.fig):plot(S.fig);
    FW.style.display='flex';G.setAttribute('width',W);G.setAttribute('height',H);G.setAttribute('viewBox',`0 0 ${W} ${H}`);G.innerHTML=s;fh=H+14}
  else{FW.style.display='none'}
  // question image
  const I=document.getElementById('qi'),QW=document.getElementById('qw');
  if(S.img.src!==curSrc){I.src=S.img.src;curSrc=S.img.src;await I.decode().catch(()=>0)}
  I.style.width=(I.naturalWidth/(S.img.s||1))+'px';
  const [cx,cy,cw,ch]=S.img.crop, avW=880, avH=1044-46-16-(S.fig?Math.min(fh,560):0);
  const k=Math.min(avW/cw,avH/ch);
  QW.style.width=cw*k+'px';QW.style.height=ch*k+'px';
  I.style.transform=`scale(${k})`;I.style.left=(-cx*k)+'px';I.style.top=(-cy*k)+'px';
  QW.querySelectorAll('.mk').forEach(e=>e.remove());
  (S.mk||[]).forEach((m,i)=>{const d=document.createElement('div');d.className='mk '+(m[4]||'');
    const last=i===S.mk.length-1&&S.mkNew; const p=last?(S.prog??1):1;
    d.style.left=((m[0]+m[2]*(1-p)-cx)*k)+'px';d.style.top=((m[1]-cy)*k)+'px';d.style.width=(m[2]*p*k)+'px';d.style.height=(m[3]*k)+'px';QW.appendChild(d)});
  // board
  document.getElementById('hh').innerHTML=S.h;
  const L=document.getElementById('ls');
  L.innerHTML=S.lines.map((l,i)=>`<div class="ln ${l.c||''} ${i<S.lines.length-(S.keep||4)?'old':''}">${l.c==='box'?`<span class="bx">${l.t}</span>`:l.t}</div>`).join('');
  const last=L.lastElementChild, p=S.prog??1;
  if(last&&p<1&&!S.lineDone){const ltr=last.firstElementChild&&last.firstElementChild.classList&&last.firstElementChild.classList.contains('m')&&last.textContent.trim().startsWith(last.firstElementChild.textContent.trim().slice(0,3));
    last.style.clipPath=ltr?`inset(-10px ${(1-p)*100}% -10px -10px)`:`inset(-10px -10px -10px ${(1-p)*100}%)`}
  // keep the newest line in view: scroll up when the board is full
  const B=document.getElementById('bd');const over=L.offsetHeight-B.clientHeight;
  L.style.top=(over>0?-over-10:0)+'px';
}
</script></body></html>
