<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>מסלול הלמידה שלי – פשוט להצליח במתמטיקה</title>
<meta name="description" content="מה לומדים בכל כיתה ובאיזה סדר: תוכנית הלימודים במתמטיקה לכיתות ז׳–י״ב, עם הסרטונים של אוראל פנחסי לפי הסדר ודפי עבודה של משרד החינוך.">
<meta name="theme-color" content="#141b3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{--card:#fff;--gold:#f5b83d;--gold2:#ffd77a;--ink:#1d2140;--line:#e7e1d3;--muted:#6b6f86;--night:#141b3a;--night2:#1f2a57;--paper:#fbf7ef;--rose:#ef6f6c;--teal:#2bb3ab}
*{box-sizing:border-box}body{margin:0;font-family:Rubik,system-ui,sans-serif;background:var(--paper);color:var(--ink)}
a{color:inherit}
.top{background:var(--night);position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.top .wrap{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top .brand{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-weight:700}
.top nav{margin-inline-start:auto;display:flex;gap:8px}
.top nav a{color:#fff;text-decoration:none;font-size:14px;padding:7px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.2)}
.top nav a.snap{background:rgba(245,184,61,.16);border-color:rgba(245,184,61,.5);color:var(--gold2);font-weight:700}
header.hd{background:linear-gradient(160deg,var(--night),var(--night2));color:#fff;padding:30px 16px 74px;text-align:center}
header .kick{display:inline-block;background:rgba(245,184,61,.15);color:var(--gold2);border:1px solid rgba(245,184,61,.4);border-radius:99px;padding:5px 14px;font-size:13px}
header h1{font-family:"Secular One",Rubik;font-size:clamp(30px,6vw,46px);margin:12px 0 8px}
header p{margin:0 auto;max-width:640px;color:#cfd4ee;line-height:1.6}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.tabs button{font:inherit;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:12px;padding:8px 16px;font-weight:700;cursor:pointer;min-width:52px}
.tabs button.on{background:var(--gold);color:var(--night);border-color:var(--gold)}
.lv{margin-top:10px}.lv button{font-size:14px;padding:6px 14px;border-radius:99px}
.lv button.on{background:#fff;color:var(--night);border-color:#fff}
.prog{max-width:780px;margin:-44px auto 0;background:var(--card);border-radius:18px;box-shadow:0 12px 30px rgba(20,27,58,.12);padding:14px 20px;position:relative;z-index:2}
.prog .row{display:flex;align-items:center;gap:16px}.prog .bar{flex:1;height:12px;background:#efe9da;border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#f39c3d);transition:width .4s}
.prog b{font-size:15px;white-space:nowrap}.prog .ttl{font-size:13px;color:var(--muted);margin-bottom:6px}
main{max-width:880px;margin:26px auto 30px;padding:0 16px;position:relative}
main:before{content:"";position:absolute;right:37px;top:10px;bottom:10px;width:4px;background:repeating-linear-gradient(var(--gold) 0 12px,transparent 12px 22px);border-radius:4px}
.unit{display:flex;gap:16px;margin-bottom:20px;position:relative}
.dot{flex:0 0 46px;height:46px;border-radius:50%;background:var(--night);color:var(--gold);font-weight:800;font-size:19px;display:grid;place-items:center;border:4px solid var(--paper);box-shadow:0 0 0 3px var(--gold);z-index:1}
.unit.full .dot{background:var(--teal);color:#fff;box-shadow:0 0 0 3px var(--teal)}
.card{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 4px 14px rgba(20,27,58,.05)}
.uh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer}.uh h2{margin:0;font-size:21px}
.mo{background:#fff4dc;color:#a8700b;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:500}
.cnt{margin-inline-start:auto;font-size:13px;color:var(--muted)}
.tg{font:inherit;border:0;background:#f2eee3;border-radius:99px;width:32px;height:32px;cursor:pointer;font-size:14px;color:var(--ink)}
.body{display:none}.unit.open .body{display:block}.unit.open .tg{transform:rotate(180deg)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:10px}@media(max-width:640px){.cols{grid-template-columns:1fr}}
h3{font-size:15px;color:var(--muted);margin:14px 0 8px;font-weight:700}
ul{margin:0;padding-inline-start:20px;line-height:1.75}
.m{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);background:#f6f8ff;border:1px solid #dfe4f6;border-radius:12px;padding:9px 12px;margin-bottom:7px;font-size:14.5px}
.m:hover{border-color:var(--night2)}.m .ft{font-size:11px;font-weight:800;background:var(--night);color:#fff;border-radius:6px;padding:2px 6px;flex:0 0 auto}
.m .src{margin-inline-start:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.none{color:var(--muted);font-size:14px}
.vs{display:grid;gap:8px}
.v{display:flex;align-items:center;gap:12px;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:7px;background:#fffdf8;cursor:pointer;text-align:start;font:inherit;width:100%}
.v:hover{border-color:var(--gold)}.v img{width:112px;height:63px;object-fit:cover;border-radius:9px;flex:0 0 auto;background:#e9e4d6}
.v .n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--gold);color:var(--night);font-weight:800;display:grid;place-items:center;font-size:14px}
.v .vt{flex:1;font-size:15px;line-height:1.35}
.ck{font:inherit;flex:0 0 36px;height:36px;border-radius:50%;border:2px solid var(--line);background:#fff;color:transparent;font-weight:800;cursor:pointer}
.v.done{background:#effaf6;border-color:#bfe9dc}.v.done .ck{background:var(--teal);border-color:var(--teal);color:#fff}
.sub{margin:10px 0 2px;font-weight:700;color:#a8700b;font-size:14px}
.gap{border:2px dashed #e6dccb;color:var(--muted);background:#fffaf0;border-radius:12px;padding:12px;font-size:14.5px}
.more{display:inline-block;margin-top:10px;font-size:14px;color:var(--night2);font-weight:700}
.practice{max-width:880px;margin:0 auto 24px;padding:0 16px}.practice .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 10px}
.note{max-width:880px;margin:0 auto 50px;padding:0 16px;color:var(--muted);font-size:13px;line-height:1.7}
.note a{color:var(--night2)}
@media(max-width:560px){main{padding:0 10px}main:before{right:26px}.unit{gap:10px}.dot{flex-basis:34px;height:34px;font-size:15px;border-width:3px}.card{padding:14px 12px}.uh h2{font-size:18px}.v{gap:8px;padding:6px}.v img{width:84px;height:47px}.v .n{flex-basis:24px;height:24px;font-size:12px}.v .vt{font-size:14px}.ck{flex-basis:30px;height:30px}.top .brand span{display:none}}
.ov{position:fixed;inset:0;background:rgba(8,12,30,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.on{display:flex}.ov .box{width:min(960px,100%);background:#000;border-radius:16px;overflow:hidden}
.ov iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
.ov .bar2{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--night);color:#fff}
.ov .bar2 b{flex:1;font-size:15px}.ov .bar2 button{font:inherit;border:0;border-radius:99px;padding:7px 14px;cursor:pointer;font-weight:700}
.ov .x{background:#fff;color:var(--night)}.ov .mk{background:var(--teal);color:#fff}
</style></head><body>
<div class="top"><div class="wrap">
  <a class="brand" href="index.html"><svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="24" r="12" fill="#f5b83d"/><circle cx="15" cy="21" r="2.2" fill="#d99a22"/><circle cx="24" cy="28" r="1.6" fill="#d99a22"/><path d="M20 3l1.6 4 4.2.3-3.2 2.7 1 4.1L20 12l-3.6 2.1 1-4.1-3.2-2.7 4.2-.3z" fill="#ffd77a"/></svg><span>פשוט להצליח במתמטיקה</span></a>
  <nav><a href="index.html#videos">כל הסרטונים</a><a class="snap" href="solve.html">📸 צלמו שאלה</a></nav>
</div></div>
<header class="hd">
  <span class="kick">לפי תוכנית הלימודים של משרד החינוך</span>
  <h1 id="h1">מסלול הלמידה שלי</h1>
  <p>מה לומדים בכל שלב של השנה, באיזה סדר לראות את הסרטונים, ודפי עבודה לתרגול. מתקדמים תחנה אחרי תחנה ומסמנים ✓ על כל סרטון שראיתם.</p>
  <div class="tabs" id="grades"></div>
  <div class="tabs lv" id="levels" hidden></div>
</header>
<div class="prog"><div class="ttl" id="ptitle"></div><div class="row"><b id="pt"></b><div class="bar"><i id="pb"></i></div></div></div>
<main id="units"></main>
<section class="practice" id="practice"></section>
<div class="note" id="note"></div>
<div class="ov" id="ov"><div class="box"><iframe id="yt" allow="autoplay; encrypted-media; fullscreen" allowfullscreen title="סרטון"></iframe>
<div class="bar2"><b id="ytt"></b><button class="mk" id="ytm">✓ צפיתי</button><button class="x" id="ytx">סגירה</button></div></div></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GR=["ז׳","ח׳","ט׳","י׳","י״א","י״ב"], LV=["3","4","5"];
let D, VID={}, cur, done={};
const st={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
try{done=JSON.parse(st.get("pshut-done")||"{}")}catch(e){}
function save(){st.set("pshut-done",JSON.stringify(done))}
function vbtn(id,n){const r=VID[id];if(!r)return"";return `<div class="v${done[id]?" done":""}" data-id="${id}" role="button" tabindex="0"><span class="n">${n}</span><img loading="lazy" src="t/${id}.webp" alt="" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${id}/mqdefault.jpg'"><span class="vt">${esc(r[3])}</span><button class="ck" type="button" aria-label="סימון צפיתי">✓</button></div>`}
function mat(m){return `<a class="m" href="${m[1]}" target="_blank" rel="noopener"><span class="ft">${esc(m[2])}</span>${esc(m[0])}<span class="src">משרד החינוך</span></a>`}
function pathIds(p){const s=new Set();p.units.forEach(u=>{u.v.forEach(i=>s.add(i));u.q.forEach(i=>s.add(i))});return [...s]}
function render(){
  const p=cur; $("#h1").textContent="מסלול הלמידה שלי · "+p.title;
  $("#grades").innerHTML=GR.map(g=>`<button data-g="${g}" class="${g===p.grade?"on":""}">${g}</button>`).join("");
  const hs=D.paths.filter(x=>x.grade===p.grade&&x.level);
  $("#levels").hidden=!hs.length;
  $("#levels").innerHTML=hs.map(x=>`<button data-id="${x.id}" class="${x.id===p.id?"on":""}">${x.level} יח״ל</button>`).join("");
  $("#units").innerHTML=p.units.map((u,k)=>{
    const ids=[...u.v,...u.q], dn=ids.filter(i=>done[i]).length, full=ids.length&&dn===ids.length;
    let vids=u.v.map((i,n)=>vbtn(i,n+1)).join("");
    if(u.q.length) vids+=`<div class="sub">📝 בוחן עצמי – נסו לבד, ואז בדקו בסרטון</div>`+u.q.map(i=>vbtn(i,"✎")).join("");
    if(!ids.length) vids=`<div class="gap">🎬 הסרטונים לנושא הזה בדרך. בינתיים אפשר לתרגל עם חומרי העבודה, או <a href="solve.html">לצלם שאלה</a> ולקבל הסבר.</div>`;
    const more=u.more?`<a class="more" href="index.html?topic=${u.more}">${u.extra?`עוד ${u.extra} סרטונים בנושא באתר ←`:"לכל הסרטונים בנושא ←"}</a>`:"";
    const mats=u.mats.length?u.mats.map(mat).join(""):`<div class="none">${p.practice?"דפי עבודה לתרגול – למטה":"תרגלו עם הסרטונים, ואם נתקעתם – צלמו שאלה 📸"}</div>`;
    return `<section class="unit${k===firstOpen(p)?" open":""}${full?" full":""}" data-k="${k}"><div class="dot">${full?"✓":k+1}</div><div class="card">
<div class="uh"><h2>${esc(u.t)}</h2>${u.m?`<span class="mo">${esc(u.m)}</span>`:""}<span class="cnt">${ids.length?`${dn}/${ids.length} סרטונים`:""}</span><button class="tg" type="button" aria-label="פתיחה">▾</button></div>
<div class="body"><div class="cols"><div><h3>מה לומדים</h3><ul>${u.learn.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div><h3>חומרי עבודה</h3>${mats}</div></div>
<h3>🎬 הסרטונים לפי הסדר</h3><div class="vs">${vids}</div>${more}</div></div></section>`}).join("");
  $("#practice").innerHTML=p.practice?`<div class="card"><div class="uh"><h2>📄 ${esc(p.practice[0])}</h2><span class="mo">משרד החינוך</span></div><p class="none" style="margin:8px 0 12px">דפי עבודה ותרגול של משרד החינוך, לחזרה ולתרגול נוסף לאורך השנה.</p><div class="grid">${p.practice[1].map(mat).join("")}</div></div>`:"";
  $("#note").innerHTML=`סדר הנושאים לפי <a href="${p.src[1]}" target="_blank" rel="noopener">${esc(p.src[0])}</a> של משרד החינוך. דפי העבודה וחומרי התרגול הם של משרד החינוך (<a href="https://pop.education.gov.il/tchumey_daat/matmatika/chativat-beynayim/teaching-mathematics/question-files/" target="_blank" rel="noopener">המרחב הפדגוגי</a>), והקישורים מובילים לקבצים המקוריים באתר המשרד.`;
  prog();
}
function firstOpen(p){for(let k=0;k<p.units.length;k++){const ids=[...p.units[k].v,...p.units[k].q];if(ids.some(i=>!done[i]))return k}return 0}
function prog(){const ids=pathIds(cur),n=ids.filter(i=>done[i]).length;$("#ptitle").textContent=cur.title;$("#pt").textContent=`${n} מתוך ${ids.length} סרטונים`;$("#pb").style.width=(ids.length?100*n/ids.length:0)+"%"}
function pick(id){cur=D.paths.find(x=>x.id===id)||D.paths[0];st.set("pshut-path",cur.id);if(location.hash.slice(1)!==cur.id)history.replaceState(null,"","#"+cur.id);render();}
function toggleDone(id,force){done[id]=force??!done[id];save();document.querySelectorAll(`.v[data-id="${id}"]`).forEach(e=>e.classList.toggle("done",!!done[id]));
  document.querySelectorAll(".unit").forEach(s=>{const u=cur.units[s.dataset.k],ids=[...u.v,...u.q],dn=ids.filter(i=>done[i]).length;s.querySelector(".cnt").textContent=ids.length?`${dn}/${ids.length} סרטונים`:"";const f=ids.length&&dn===ids.length;s.classList.toggle("full",f);s.querySelector(".dot").textContent=f?"✓":(+s.dataset.k+1)});prog();}
let playing=null;
function play(id){playing=id;$("#yt").src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0`;$("#ytt").textContent=VID[id]?VID[id][3]:"";$("#ytm").textContent=done[id]?"✓ סומן":"✓ צפיתי";$("#ov").classList.add("on")}
function closeV(){$("#ov").classList.remove("on");$("#yt").src="";playing=null}
document.addEventListener("click",e=>{
  const g=e.target.closest("#grades button");if(g){const c=D.paths.filter(x=>x.grade===g.dataset.g);const pref=st.get("pshut-lv")||"5";pick((c.find(x=>x.level===pref)||c.find(x=>x.level==="4")||c[0]).id);return}
  const l=e.target.closest("#levels button");if(l){const p=D.paths.find(x=>x.id===l.dataset.id);st.set("pshut-lv",p.level);pick(p.id);return}
  const ck=e.target.closest(".ck");if(ck){e.stopPropagation();toggleDone(ck.closest(".v").dataset.id);return}
  const v=e.target.closest(".v");if(v){play(v.dataset.id);return}
  const h=e.target.closest(".uh");if(h){h.closest(".unit").classList.toggle("open");return}
  if(e.target.id==="ytx"||e.target.id==="ov")closeV();
  if(e.target.id==="ytm"&&playing){toggleDone(playing,true);$("#ytm").textContent="✓ סומן"}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeV();if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("v"))play(e.target.dataset.id)});
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&cur&&h!==cur.id)pick(h)});
Promise.all([fetch("learn-data.json").then(r=>r.json()),fetch("videos.json").then(r=>r.json())]).then(([d,v])=>{
  D=d;v.forEach(r=>VID[r[0]]=r);
  const h=location.hash.slice(1);pick(D.paths.some(x=>x.id===h)?h:(st.get("pshut-path")||"z"));
}).catch(()=>{$("#units").innerHTML='<div class="gap">לא הצלחתי לטעון את המסלול. נסו לרענן את הדף.</div>'});
</script>
</body></html>
