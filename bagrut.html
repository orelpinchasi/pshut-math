<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>בגרות במתמטיקה – שאלונים, תשובות ופתרונות | פשוט להצליח במתמטיקה</title>
<link rel="canonical" href="https://orelpinchasi.github.io/pshut-math/bagrut.html">
<meta name="description" content="בחינות בגרות במתמטיקה עם תשובות ופתרונות – שאלוני 35371, 35372, 35471, 35472, 35571, 35572 לפי מועד, עם סרטוני הסבר לכל נושא.">
<style>
:root{--c:#fff;--g:#f5b83d;--g2:#ffd77a;--i:#1d2140;--l:#e7e1d3;--m:#6b6f86;--n:#141b3a;--n2:#1f2a57;--p:#fbf7ef;--t:#2bb3ab;--r:#e8655a}
*{box-sizing:border-box}
body{margin:0;font-family:"Rubik","Assistant","Segoe UI",Arial,sans-serif;background:var(--p);color:var(--i)}
a{color:inherit}
.hd{background:linear-gradient(160deg,var(--n),var(--n2));color:#fff;padding:30px 16px 70px;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;max-width:980px;margin:0 auto 18px;font-size:14px}
.top a{text-decoration:none;color:#cfd4ee}
.kick{display:inline-block;background:rgba(245,184,61,.15);color:var(--g2);border:1px solid rgba(245,184,61,.4);border-radius:99px;padding:5px 14px;font-size:13px}
h1{font-size:clamp(28px,5vw,42px);margin:12px 0 8px}
.hd p{margin:0 auto;max-width:640px;color:#cfd4ee;line-height:1.6}
.lv{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.lv button,.qs button{font:inherit;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:12px;padding:9px 18px;font-weight:700;cursor:pointer;font-size:16px}
.lv button.on{background:var(--g);color:var(--n);border-color:var(--g)}
.qs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.qs button{font-size:14px;padding:6px 14px;border-radius:99px}
.qs button.on{background:#fff;color:var(--n);border-color:#fff}
.wrap{max-width:980px;margin:-44px auto 0;padding:0 14px 40px;position:relative}
.card{background:var(--c);border-radius:18px;box-shadow:0 12px 30px rgba(20,27,58,.10);padding:18px 20px;margin-bottom:16px}
.qhead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.qhead h2{margin:0;font-size:24px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#f3efe4;border-radius:99px;padding:4px 11px;font-size:13px;color:var(--m)}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border-radius:10px;padding:7px 12px;font-size:14px;font-weight:700;border:1px solid var(--l);background:#fff;cursor:pointer;font-family:inherit;color:var(--i)}
.btn.y{background:var(--g);border-color:var(--g);color:var(--n)}
.btn.t{background:#e6f6f5;border-color:#bfe8e5;color:#13756f}
.btn.off{color:var(--m);background:#faf8f3}
h3{margin:4px 0 12px;font-size:19px}
.ses{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.s{border:1px solid var(--l);border-radius:14px;padding:12px 14px;background:#fffdf8}
.s .nm{font-weight:800;font-size:17px}.s .hy{color:var(--m);font-size:13px;margin-inline-start:6px}
.s .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.s .mine{margin-top:9px;border-top:1px dashed var(--l);padding-top:8px;font-size:14px}
.s .mine b{color:var(--r)}
.part{border-top:1px solid var(--l);padding:14px 0 6px}
.part:first-of-type{border-top:0;padding-top:4px}
.part .pt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.part h4{margin:0;font-size:17px}.part .d{color:var(--m);font-size:13px}
.vl{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:6px 14px}
.vl li{display:flex;gap:8px;align-items:flex-start;cursor:pointer;padding:6px 8px;border-radius:10px;font-size:14.5px;line-height:1.35}
.vl li:hover{background:#f6f2e8}
.vl li .pl{flex:0 0 26px;height:26px;border-radius:50%;background:var(--r);color:#fff;display:grid;place-items:center;font-size:11px;margin-top:1px}
.vl li.rest{display:none}.part.open .vl li.rest{display:flex}
.more{margin-top:8px;font:inherit;background:none;border:0;color:#13756f;font-weight:700;cursor:pointer;padding:4px 8px}
.note{font-size:13px;color:var(--m);line-height:1.6}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--m);margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(10,14,30,.8);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}.modal .box{width:min(960px,100%);aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;position:relative}
.modal iframe{width:100%;height:100%;border:0}.modal .x{position:absolute;top:-44px;left:0;background:#fff;border:0;border-radius:99px;padding:6px 14px;font:inherit;cursor:pointer}
@media(max-width:560px){.qhead h2{font-size:20px}.vl{grid-template-columns:1fr}}
.solin{grid-column:1/-1;background:#fff;border:2px solid var(--g);border-radius:16px;padding:14px}
.solin:empty{display:none}
.btn.soon{opacity:.5;cursor:default;border-style:dashed}
.btn.fs{background:#141b3a;border-color:#141b3a;color:#ffd77a}
.s.cur{outline:3px solid var(--g)}
.sol h3{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.qq{border:1px solid var(--l);border-radius:14px;margin:10px 0;background:#fffdf8;overflow:hidden}
.qq>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:800}
.qq>summary::-webkit-details-marker{display:none}
.qq>summary .n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--g);color:var(--n);display:grid;place-items:center}
.qq>summary .tt{flex:1}.qq>summary .ar{color:var(--m);transition:.2s}.qq[open]>summary .ar{transform:rotate(180deg)}
.qb{padding:0 14px 14px}
.pp{border-top:1px dashed var(--l);padding:10px 0}
.pp .pl2{font-weight:800;color:#13756f;margin-bottom:4px}
.pp li{overflow-x:auto;overflow-y:hidden;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #f1ece0}
.pp ol{margin:4px 0;padding-inline-start:22px;line-height:1.9}
.pp .ans{display:inline-block;margin-top:6px;background:#e6f6f5;border:1px solid #bfe8e5;border-radius:10px;padding:6px 12px;font-weight:700}
.pp .hid{display:none}.pp.show .hid{display:block}.pp.show .rv{display:none}
.rv{font:inherit;font-size:14px;border:1px solid var(--l);background:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;color:#13756f;font-weight:700}
.katex{font-size:1.05em;direction:ltr;unicode-bidi:isolate}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div class="hd">
  <div class="top"><a href="index.html">← חזרה לאתר</a><span><a href="worksheets.html">📄 דפי עבודה</a> &nbsp;·&nbsp; <a href="index.html#path">🗺️ מסלול למידה</a></span></div>
  <span class="kick">תוכנית הלימודים החדשה · שאלוני משרד החינוך</span>
  <h1>שאלוני בגרות + סרטוני פתרון</h1>
  <p>כל מועדי הבגרות בתוכנית החדשה: טופס הבחינה המקורי, תשובות סופיות, <b style="color:#ffd77a">פתרונות מלאים שלב אחרי שלב</b> וסרטוני פתרון.</p>
  <div class="lv" id="lv"></div>
  <div class="qs" id="qs"></div>
</div>
<div class="wrap" id="app"></div>
<div class="modal" id="mdl"><div class="box"><button class="x" id="mx">✕ סגירה</button><iframe id="mf" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div></div>
<script>
(async function(){
const D=await (await fetch('bagrut-data.json',{cache:'no-cache'})).json();
const LV=[['3','3 יח"ל'],['4','4 יח"ל'],['5','5 יח"ל']];
let st={lv:'4',q:'35471'};
try{const s=JSON.parse(localStorage.getItem('pshut-bag')||'null');if(s)st=s}catch(e){}
const h=location.hash.slice(1);if(/^35[345]7[12]/.test(h)){st.q=h.slice(0,5);st.lv=h[2];st.fs=h.length>5?h:null}
const EMBED=/github\.io$|pshut/.test(location.hostname);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function play(id){
  if(EMBED){document.getElementById('mf').src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0';document.getElementById('mdl').classList.add('on')}
  else window.open('https://www.youtube.com/watch?v='+id,'_blank','noopener');
}
document.getElementById('mx').onclick=document.getElementById('mdl').onclick=e=>{if(e.target.id==='mdl'||e.target.id==='mx'){document.getElementById('mdl').classList.remove('on');document.getElementById('mf').src=''}};
function render(){
  try{localStorage.setItem('pshut-bag',JSON.stringify(st))}catch(e){}
  document.getElementById('lv').innerHTML=LV.map(([k,t])=>`<button data-lv="${k}" class="${k===st.lv?'on':''}">${t}</button>`).join('');
  const qs=D.q.filter(q=>q.id[2]===st.lv);
  if(!qs.some(q=>q.id===st.q))st.q=qs[0].id;
  document.getElementById('qs').innerHTML=qs.map(q=>`<button data-q="${q.id}" class="${q.id===st.q?'on':''}">${q.id} · ${q.nm}</button>`).join('');
  const q=D.q.find(x=>x.id===st.q);
  let o=`<div class="card"><div class="qhead"><div><h2>שאלון ${q.id} — ${q.lv}, ${q.nm}</h2>
   <div class="chips" style="margin-top:8px"><span class="chip">כיתה ${q.gr}</span><span class="chip">${q.w} מהציון</span><span class="chip">${q.parts.length} פרקים</span></div></div>
   <div class="chips"><a class="btn" target="_blank" rel="noopener" href="${D.formula[st.lv]}">📄 דפי נוסחאות</a><a class="btn" target="_blank" rel="noopener" href="${D.repo}">🗂️ מאגר הבחינות המלא</a></div></div></div>`;
  o+=`<div class="card"><h3>📝 טופסי הבחינה לפי מועד</h3><div class="ses">`+q.ss.map(s=>`<div class="s${s.k===st.fs?' cur':''}"><span class="nm">${s.lbl}</span><span class="hy">${s.hy}</span>
    <div class="row">${s.pdf?`<a class="btn y" target="_blank" rel="noopener" href="${s.pdf}">📄 טופס הבחינה</a>`:`<a class="btn off" target="_blank" rel="noopener" href="${D.repo}">🔎 טופס הבחינה במאגר</a>`}
    ${s.sol?`<a class="btn t" target="_blank" rel="noopener" href="${s.sol}">✔️ תשובות סופיות</a>`:`<a class="btn off" target="_blank" rel="noopener" href="${D.repo}">🔎 תשובות במאגר</a>`}
    ${s.fs?`<button class="btn fs" data-fs="${s.k}">🎬 ${s.k===st.fs?'הסתרת הפתרונות':'צפייה בפתרונות'}</button>`:`<span class="btn soon">🎬 פתרונות בקרוב</span>`}</div>
    ${s.v.length?`<div class="mine">🎬 <b>פתרון שלי:</b> `+s.v.map(([id,t])=>`<a href="#" data-v="${id}">${esc(t)}</a>`).join(' · ')+`</div>`:''}</div><div class="solin" id="sb-${s.k}"></div>`).join('')+`</div>
    <div class="lg"><span>📄 / ✔️ קישור ישיר לקובץ באתר משרד החינוך</span><span>🎬 פתרון מלא לכל שאלה: סרטון + פתרון כתוב</span></div></div>`;
  o+=`<div class="card"><h3>🎬 סרטוני פתרון לפי פרקי השאלון</h3>`+q.parts.map((p,pi)=>`<div class="part" id="pp${pi}"><div class="pt"><h4>${p.t}</h4><span class="d">${esc(p.d||'')} · ${p.v.length} סרטונים</span></div>
    <ul class="vl">${p.v.map(([id,t],i)=>`<li data-v="${id}" class="${i>=10?'rest':''}"><span class="pl">▶</span><span>${esc(t)}</span></li>`).join('')}</ul>
    ${p.v.length>10?`<button class="more" data-pp="${pi}">הצגת כל ${p.v.length} הסרטונים ▾</button>`:''}</div>`).join('')+`</div>`;
  o+=`<p class="note">טופסי הבחינה והתשובות הסופיות שייכים למשרד החינוך ומקושרים לאתר המשרד, ולא מאוחסנים כאן. © זכות היוצרים שמורה למדינת ישראל.</p>`;
  document.getElementById('app').innerHTML=o;
  const cur=q.ss.find(s=>s.k===st.fs&&s.fs);if(cur)showSol(q,cur,false);
}
function M(t){return String(t).split('$').map((x,i)=>{if(!(i%2))return x;try{return katex.renderToString(x,{throwOnError:false,strict:false})}catch(e){return esc(x)}}).join('')}
const SC={};
async function showSol(q,s,scroll){
  document.querySelectorAll('.solin').forEach(x=>x.innerHTML='');const box=document.getElementById('sb-'+s.k);
  box.innerHTML='<div class="card">טוען פתרון…</div>';
  try{
    for(let i=0;i<50&&!window.katex;i++)await new Promise(r=>setTimeout(r,100));
    const S=SC[s.k]||(SC[s.k]=await (await fetch('sol/'+s.k+'.json',{cache:'no-cache'})).json());
    box.innerHTML=`<div class="sol"><h3><span>🎬 פתרונות · ${s.lbl}</span></h3>
     <p class="note">פותחים את השאלה בטופס המקורי, מנסים לפתור לבד, ורק אז לוחצים "הצגת הפתרון" בכל סעיף.${S.ver?` הפתרון מתאים ל<b>גרסה ${S.ver}</b> של השאלון.`:''}</p>`+
     S.q.map(x=>`<details class="qq"><summary><span class="n">${x.n}</span><span class="tt">${esc(x.t)}</span><span class="ar">▾</span></summary><div class="qb">
       ${x.mp4?`<video controls playsinline preload="none" poster="" src="media/bagrut/${s.k}_${x.n}.mp4" style="width:100%;border-radius:12px;margin:6px 0 10px;background:#000"></video>`:''}${x.vid?`<a class="btn fs" href="solve.html?lesson=${s.k}_${x.n}">🎬 שיעור וידאו עם אוראל</a> `:''}${s.pdf?`<a class="btn" target="_blank" rel="noopener" href="${s.pdf}#page=${x.p}">📄 שאלה ${x.n} בטופס (עמ' ${x.p})</a>`:''}
       ${x.s.map(p=>`<div class="pp"><div class="pl2">סעיף ${p.l}</div><button class="rv">👀 הצגת הפתרון</button><div class="hid"><ol>${p.b.map(b=>`<li>${M(b)}</li>`).join('')}</ol><div class="ans">✔️ ${p.a.split('||').map(M).join('<br>')}</div></div></div>`).join('')}
       <button class="rv" data-all="1" style="margin-top:6px">הצגת כל הסעיפים</button></div></details>`).join('')+`</div>`;
    if(scroll)box.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){box.innerHTML='<div class="card">לא הצלחנו לטעון את הפתרון. נסו לרענן.</div>'}
}
document.addEventListener('click',e=>{
  const r=e.target.closest('.rv');if(r){if(r.dataset.all)r.parentNode.querySelectorAll('.pp').forEach(p=>p.classList.add('show'));else r.parentNode.classList.add('show');return}
  const b=e.target.closest('[data-lv],[data-q],[data-v],[data-pp],[data-fs]');if(!b)return;
  if(b.dataset.fs){if(st.fs===b.dataset.fs){st.fs=null;history.replaceState(null,'',location.pathname+'#'+st.q);render();return}st.fs=b.dataset.fs;const q=D.q.find(x=>x.id===st.q);document.querySelectorAll('.s.cur').forEach(x=>x.classList.remove('cur'));document.querySelectorAll('[data-fs]').forEach(x=>x.textContent='🎬 צפייה בפתרונות');b.textContent='🎬 הסתרת הפתרונות';b.closest('.s').classList.add('cur');history.replaceState(null,'','#'+st.fs);showSol(q,q.ss.find(s=>s.k===st.fs),true);try{localStorage.setItem('pshut-bag',JSON.stringify(st))}catch(e){}return}
  if(b.dataset.lv){st.lv=b.dataset.lv;render()}
  else if(b.dataset.q){st.q=b.dataset.q;history.replaceState(null,'','#'+st.q);render()}
  else if(b.dataset.v){e.preventDefault();play(b.dataset.v)}
  else if(b.dataset.pp){const p=document.getElementById('pp'+b.dataset.pp);p.classList.toggle('open');b.textContent=p.classList.contains('open')?'הצגת פחות ▴':'הצגת כל הסרטונים ▾'}
});
render();
})();
addEventListener('hashchange',()=>location.reload());
</script>
</body>
</html>
