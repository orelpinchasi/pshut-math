<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>יסודי א׳–ו׳ | פשוט להצליח במתמטיקה</title>
<link rel="canonical" href="https://orelpinchasi.github.io/pshut-math/yesodi.html">
<meta name="description" content="מתמטיקה ליסודי, כיתות א׳–ו׳: סרטוני הסבר, תרגול, משחקים ודפי עבודה לכל נושא – בחינם.">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Secular+One&family=Gveret+Levin&family=Playpen+Sans+Hebrew:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: שמח, חם, מעודד – לילדים
   IDEA: מחברת משבצות של "פשוט להצליח" – כתב יד כחול, עיגולים אדומים, פתקים צהובים
   PICTURE: הלוח עם השאלה המוצמדת וההמחשה המונפשת
   COLOUR/TYPE: כחול לילה + זהב של האתר, טורקיז ואלמוג לשמחה; Gveret Levin לכתב יד
   LAYOUT: עמודה אחת, השאלה דבוקה למעלה, שליטה דבוקה למטה */
:root{--c:#fff;--g:#f5b83d;--g2:#ffd77a;--i:#1d2140;--l:#e7e1d3;--m:#6b6f86;--n:#141b3a;--n2:#1f2a57;--p:#fbf7ef;--t:#2bb3ab;--r:#e2675b;--ink:#1d2a6b;--red:#e0312b;--pur:#7c6be0}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:90px}
body{margin:0;font-family:"Rubik","Assistant","Segoe UI",Arial,sans-serif;background-color:#fdf6ff;background-image:radial-gradient(circle at 20px 20px,rgba(245,184,61,.18) 0 4px,transparent 5px),radial-gradient(circle at 70px 60px,rgba(43,179,171,.16) 0 5px,transparent 6px),radial-gradient(circle at 110px 25px,rgba(226,103,91,.14) 0 3px,transparent 4px),radial-gradient(circle at 40px 100px,rgba(124,107,224,.15) 0 4px,transparent 5px);background-size:140px 130px;color:var(--i);overflow-x:clip;--gc:#7c6be0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--t);outline-offset:2px}
.hd{background:linear-gradient(160deg,var(--gc),color-mix(in srgb,var(--gc) 55%,#141b3a));color:#fff;padding:22px 16px 66px;text-align:center;position:relative;overflow:hidden}
.hd::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 30%,rgba(245,184,61,.18) 0 60px,transparent 61px),radial-gradient(circle at 88% 70%,rgba(43,179,171,.2) 0 80px,transparent 81px);pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;max-width:980px;margin:0 auto 14px;font-size:14px;gap:10px;flex-wrap:wrap;position:relative}
.top a{text-decoration:none;color:#cfd4ee}
.crumb{max-width:980px;margin:0 auto 6px;font-size:14px;color:#cfd4ee;text-align:right;position:relative}
.crumb a{color:var(--g2);text-decoration:none;font-weight:700}
.kick{display:inline-block;background:rgba(245,184,61,.15);color:var(--g2);border:1px solid rgba(245,184,61,.4);border-radius:99px;padding:5px 14px;font-size:13px;position:relative}
h1{font-family:"Secular One",Rubik,sans-serif;font-weight:400;font-size:clamp(28px,5.5vw,42px);margin:10px 0 6px;text-wrap:balance;position:relative}
.hd p{margin:0 auto;max-width:640px;color:#cfd4ee;line-height:1.6;position:relative}
.wrap{max-width:980px;margin:-44px auto 0;padding:0 12px 40px;position:relative}
.card{background:var(--c);border-radius:24px;box-shadow:0 10px 0 color-mix(in srgb,var(--gc) 18%,transparent),0 14px 30px rgba(20,27,58,.08);border:2px solid color-mix(in srgb,var(--gc) 22%,#fff);padding:18px;margin-bottom:16px}
h3{margin:2px 0 4px;font-size:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub{color:var(--m);font-size:14px;margin:0 0 14px;line-height:1.5}
.note{font-size:13px;color:var(--m);line-height:1.6}
.center{text-align:center}
.big{font-weight:800;font-size:17px;border:0;border-radius:16px;padding:13px 22px;background:var(--g);color:var(--n);text-decoration:none;display:inline-block;box-shadow:0 4px 0 #c98f1e;min-height:48px}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #c98f1e}
.big.alt{background:#fff6e0;border:1px solid #f0d9a6;color:#7a5200;font-size:15px;padding:10px 15px;box-shadow:none;min-height:44px}
.big.teal{background:var(--t);color:#fff;box-shadow:0 4px 0 #1d8a84}
.row2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
/* math */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1;margin:0 .08em;font-size:.82em}
.fr b{font-weight:inherit;padding:0 .12em}.fr b:first-child{border-bottom:.08em solid currentColor;padding-bottom:.06em}.fr b:last-child{padding-top:.06em}
.m{unicode-bidi:isolate;direction:ltr;white-space:nowrap;display:inline-block}
/* home */
.mascot-hi{display:flex;gap:12px;align-items:center;background:#fff6e0;border:2px dashed #f0d9a6;border-radius:18px;padding:12px 14px;margin-bottom:14px}
.mascot-hi svg{flex:none;width:58px;height:58px}
.mascot-hi b{font-family:"Secular One";font-size:18px;display:block}
.grades{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gc{display:block;text-decoration:none;color:#fff;border-radius:20px;padding:16px;position:relative;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.15);transition:transform .15s}
.gc:hover{transform:translateY(-3px) rotate(-1deg)}
.gc .L{font-family:"Secular One";font-size:46px;line-height:1}
.gc b{display:block;margin:6px 0 2px;font-size:16px}
.gc span{font-size:13px;line-height:1.4;display:block;opacity:.92}
.gc .pr{margin-top:10px;height:7px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}.gc .pr i{display:block;height:100%;background:#fff}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.tc{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;border:2px solid color-mix(in srgb,var(--gc) 30%,#fff);border-radius:18px;padding:12px;background:color-mix(in srgb,var(--gc) 7%,#fff);transition:transform .15s}
.tc:nth-child(6n+1) .n{--k:#e2675b}.tc:nth-child(6n+2) .n{--k:#f0a030}.tc:nth-child(6n+3) .n{--k:#2bb3ab}.tc:nth-child(6n+4) .n{--k:#4f8de0}.tc:nth-child(6n+5) .n{--k:#7c6be0}.tc:nth-child(6n+6) .n{--k:#d65aa0}
.tc:hover{transform:translateY(-2px) rotate(-.5deg)}
.tc:hover{border-color:var(--g)}
.tc .n{flex:none;width:46px;height:46px;border-radius:50% 46% 52% 48%;border:0;background:var(--k,var(--red));color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15);display:grid;place-items:center;font-family:"Gveret Levin",cursive;font-size:24px}
.tc b{display:block;font-size:16px}
.tc span{font-size:13px;color:var(--m);line-height:1.4}
.tc .st{margin-inline-start:auto;color:var(--g);font-size:15px;letter-spacing:1px;flex:none;text-align:center}
.tc .st small{display:block;color:var(--t);font-size:11px;letter-spacing:0}
.inc{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.inc span{font-size:13px;background:#eef0fa;color:#3b4580;border-radius:99px;padding:5px 12px;font-weight:700}
/* tabs */
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px;position:relative}
.tabs button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px;min-height:44px}
.tabs button.on{background:#fff;color:var(--gc);border-color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.lv{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.lv button{border:2px solid var(--l);background:#fff;border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--m);min-height:40px}
.lv button.on{background:var(--n);color:#fff;border-color:var(--n)}
/* ===== notebook (כמו "צלמו שאלה") ===== */
.nb{background-color:#fff;background-image:linear-gradient(rgba(70,110,200,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(70,110,200,.13) 1px,transparent 1px);background-size:22px 22px;border-radius:16px;border:1px solid #dfe4f3;padding:14px 12px}
.hand{font-family:"Gveret Levin","Playpen Sans Hebrew",cursive;color:var(--ink)}
.qcard{position:sticky;top:0;z-index:20;background:#fffdf3;border:2px solid #f0d9a6;border-radius:0 0 16px 16px;padding:10px 14px 12px;margin:-18px -18px 14px;box-shadow:0 8px 18px rgba(20,27,58,.10)}
.qcard .ql{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.qcard .qtag{background:var(--n);color:var(--g2);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
.qcard .qtxt{font-family:"Playpen Sans Hebrew",Rubik,sans-serif;font-size:clamp(17px,4.4vw,22px);font-weight:600;line-height:1.5;color:var(--n)}
.lchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.lchips button{border:2px solid var(--l);background:#fff;border-radius:14px;padding:8px 12px;font-weight:700;font-size:14px;text-align:right;min-height:44px;display:flex;gap:6px;align-items:center}
.lchips button.on{border-color:var(--gc);background:color-mix(in srgb,var(--gc) 12%,#fff)}
.way{font-size:12px;font-weight:800;border-radius:99px;padding:2px 8px;background:color-mix(in srgb,var(--gc) 16%,#fff);color:color-mix(in srgb,var(--gc) 70%,#141b3a);white-space:nowrap}
.lgroup{font-size:13px;font-weight:800;color:var(--m);margin:4px 0 6px;width:100%}
.lchips .ok{color:var(--t)}
.startbox{border:2px dashed var(--g);border-radius:16px;padding:16px;text-align:center;background:#fffdf3;margin-bottom:12px}
.startbox p{margin:8px 0 0;color:var(--m);font-size:14px}
.stp{margin:0 0 18px;opacity:.28;transition:opacity .4s}
.stp.show{opacity:1}
.stp.hide{display:none}
.stp .hd2{display:flex;align-items:center;gap:8px;font-family:"Gveret Levin",cursive;font-size:clamp(21px,5vw,26px);color:var(--ink);line-height:1.2;margin-bottom:6px}
.stp .num{flex:0 0 36px;height:36px;border:2.5px solid var(--red);border-radius:50% 46% 52% 48%;display:grid;place-items:center;color:var(--red);font-size:22px}
.stp.now .num{background:#ffe9e7;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.stp .stage{width:100%;border-radius:14px;margin:6px 0 10px;max-width:560px;margin-inline:auto}
.ln{font-family:"Gveret Levin",cursive;font-size:clamp(22px,5.4vw,28px);color:var(--ink);padding:2px 8px;line-height:1.45;opacity:0}
.ln.math{direction:ltr;text-align:center;font-family:"Playpen Sans Hebrew",Rubik;font-size:clamp(20px,5vw,26px);font-weight:600}
.stp.show .ln{animation:write .7s ease forwards}
.ln.okl{color:#0f7a54}
.ln.okl::after{content:"";display:block;height:6px;margin-top:-6px;background:rgba(245,184,61,.45);border-radius:3px;transform-origin:right;animation:mark .6s .4s both}
.ln.bad{color:var(--red);text-decoration:line-through}
@keyframes write{from{opacity:0;clip-path:inset(0 0 0 100%)}to{opacity:1;clip-path:inset(0)}}
@keyframes mark{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ln.math.blkshow{animation-name:writeL}
@keyframes writeL{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0)}}
.ansbox{border:3px solid var(--t);border-radius:18px;background:#e9faf7;padding:12px 14px;margin-top:6px}
.ansbox b{font-family:"Secular One";color:#0f6a64}
.ansbox .hand{font-size:28px}
.sticky-note{background:#fff3a8;border-radius:4px 14px 6px 12px;padding:12px 14px;margin-top:12px;box-shadow:0 6px 12px rgba(0,0,0,.08);transform:rotate(-1deg)}
.sticky-note .hand{font-size:24px}
.capbar{position:sticky;bottom:0;z-index:20;background:#fff;border-top:2px solid var(--l);margin:14px -18px -18px;padding:10px 12px 12px;border-radius:0 0 20px 20px;box-shadow:0 -8px 18px rgba(20,27,58,.08)}
.cap{min-height:52px;font-size:clamp(15px,3.8vw,18px);line-height:1.6;text-align:center;padding:0 4px 8px}
.cap .w{transition:color .15s}.cap .w.on{color:var(--red);font-weight:700}.cap .w.done{color:var(--i)}.cap .w.next{color:#9aa0b8}
.ctrl{display:flex;align-items:center;justify-content:center;gap:10px}
.ctrl button{background:#f1f2f8;border:0;border-radius:50%;width:48px;height:48px;font-size:18px;display:grid;place-items:center}
.ctrl .pp{width:62px;height:62px;background:var(--n);color:#fff;font-size:24px}
.ctrl .sp{width:auto;border-radius:99px;padding:0 12px;font-size:14px;font-weight:800}
.prog{height:6px;background:#eef0f6;border-radius:99px;overflow:hidden;margin-bottom:8px;cursor:pointer}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--t),var(--g))}
/* ===== practice ===== */
.pq{text-align:center;padding:14px 8px 6px}
.pq .q{font-family:"Playpen Sans Hebrew",Rubik;font-size:clamp(30px,8vw,48px);font-weight:700;color:var(--n);line-height:1.35}
.pq .q.he{font-size:clamp(19px,4.8vw,25px);line-height:1.6;font-family:Rubik,sans-serif}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:480px;margin:10px auto 0}
.opts button{font-family:"Playpen Sans Hebrew",Rubik;font-size:clamp(20px,5vw,28px);font-weight:700;padding:12px 6px;min-height:64px;border-radius:18px;border:3px solid var(--l);background:#fffdf8;box-shadow:0 4px 0 var(--l);transition:transform .1s}
.opts button:active{transform:translateY(3px);box-shadow:none}
.opts button.ok{background:#dff5ef;border-color:var(--t);box-shadow:0 4px 0 var(--t)}
.opts button.no{background:#fde6e3;border-color:var(--r);box-shadow:0 4px 0 var(--r);animation:shake .4s}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.mic{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.mic button{border:2px solid var(--pur);background:#f2f0ff;color:var(--pur);border-radius:99px;padding:9px 16px;font-weight:800;min-height:46px}
.mic button.rec{background:var(--pur);color:#fff;animation:pulse 1s infinite}
.heard{font-size:14px;color:var(--m);text-align:center;min-height:20px;margin-top:6px}
.stats{display:flex;justify-content:space-between;font-size:14px;color:var(--m);font-weight:700}
.pbar{height:10px;background:#f0ebe0;border-radius:99px;overflow:hidden;margin:6px 0 4px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--t),var(--g));transition:width .5s}
.fb{display:flex;gap:10px;align-items:center;margin:14px auto 0;max-width:520px;border-radius:18px;padding:10px 12px}
.fb.good{background:#e9faf7;border:2px solid var(--t)}.fb.bad{background:#fff1ef;border:2px solid #f3b7af}
.fb svg{flex:none;width:52px;height:52px}
.fb b{font-family:"Secular One";font-size:19px;display:block}
.sol{margin:12px auto 0;max-width:560px}
.sol summary{cursor:pointer;font-weight:800;color:var(--ink);padding:8px 0;font-size:16px}
.sol .nb{padding:10px 12px}
.sol .ln{opacity:1;animation:none!important;font-size:clamp(20px,5vw,25px)}
.sol .ln.math{font-size:clamp(18px,4.6vw,22px)}
.hint{background:#eef7f6;border:2px solid #bfe6e2;border-radius:14px;padding:10px 14px;margin:12px auto 0;max-width:520px;font-size:15px;line-height:1.6;color:#13534f}
.end{font-size:18px;line-height:1.6;margin:8px 0 14px;text-align:center}.end .s{font-family:"Secular One";font-size:52px;color:var(--t);display:block;line-height:1.1}
.stars{font-size:40px;color:var(--g);letter-spacing:4px}
/* ===== games ===== */
.gpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.gpick button{border:0;background:var(--gk,#fffdf8);border-radius:20px;padding:12px;text-align:right;min-height:88px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.gpick button span{color:rgba(255,255,255,.9)!important}
.gpick button.on{outline:4px solid #fff;outline-offset:-7px;transform:translateY(-2px)}
.gpick .ge{font-size:30px;line-height:1;display:block;margin-bottom:4px}
.gpick b{display:block;font-size:16px}.gpick span{font-size:12.5px;color:var(--m)}
.gq{text-align:center;font-family:"Playpen Sans Hebrew",Rubik;font-weight:700;font-size:clamp(24px,6.5vw,36px);color:var(--n);margin:4px 0 8px;line-height:1.4}
.gq.he{font-size:clamp(17px,4.4vw,22px);font-family:Rubik,sans-serif}
.sky{position:relative;height:380px;border-radius:18px;background:linear-gradient(#bfe3ff,#e8f6ff 70%,#d8f3d0);overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:99px;opacity:.85}
.bl{position:absolute;bottom:-110px;width:88px;height:104px;border:0;border-radius:50% 50% 46% 46%;color:#fff;font-family:"Playpen Sans Hebrew",Rubik;font-weight:800;font-size:21px;display:grid;place-items:center;animation:rise linear infinite;box-shadow:inset -10px -12px 0 rgba(0,0,0,.12);text-shadow:0 1px 2px rgba(0,0,0,.3);padding:4px}
.bl::after{content:"";position:absolute;bottom:-18px;left:50%;width:1.5px;height:20px;background:#777}
.bl.popd{animation:burst .3s forwards!important}.bl.gone{animation:fall .6s forwards!important;filter:grayscale(1)}
@keyframes rise{from{bottom:-110px}to{bottom:400px}}@keyframes burst{to{transform:scale(1.7);opacity:0}}@keyframes fall{to{transform:translateY(500px) rotate(40deg);opacity:0}}
.river{position:relative;border-radius:18px;background:repeating-linear-gradient(0deg,#5fb8e6 0 26px,#6cc2ec 26px 52px);padding:12px 8px;min-height:330px;overflow:hidden}
.bank{background:#8fd17a;border-radius:12px;padding:8px;text-align:center;font-weight:800;color:#2f6b20}
.pads{display:flex;justify-content:space-around;margin:20px 0}
.pad{width:96px;height:72px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#8be27a,#3f9a3a);border:0;color:#fff;font-family:"Playpen Sans Hebrew",Rubik;font-weight:800;font-size:20px;box-shadow:0 5px 0 #2d6e29;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.pad.sink{animation:sink .6s forwards}@keyframes sink{to{transform:scale(.2);opacity:0}}
.frog{font-size:46px;text-align:center;transition:transform .5s cubic-bezier(.3,1.6,.6,1)}
.frog.jump{animation:hop .55s}@keyframes hop{40%{transform:translateY(-60px) scale(1.2)}}
.monster{display:flex;flex-direction:column;align-items:center}
.monster svg{width:min(200px,50vw);height:auto;transition:transform .3s}
.monster.nom svg{animation:nom .5s}.monster.yuck svg{animation:shake .5s}
@keyframes nom{30%{transform:scale(1.15)}60%{transform:scale(.95)}}
.cookies{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:420px;margin:12px auto 0}
.cookie{aspect-ratio:1;max-height:110px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#f2c27d,#c98a3d);color:#3d2408;font-family:"Playpen Sans Hebrew",Rubik;font-weight:800;font-size:clamp(17px,4.5vw,22px);box-shadow:0 5px 0 #8f5d22;position:relative;margin:auto;width:100%}
.cookie::before{content:"";position:absolute;inset:18%;background:radial-gradient(circle,#5a3412 0 6%,transparent 7%) 10% 20%/40% 40%;opacity:.5;border-radius:50%}
.cookie.fly{transition:transform .5s ease-in,opacity .5s;opacity:0}
.tf{display:flex;gap:12px;justify-content:center;margin-top:14px}
.tf button{flex:1;max-width:180px;border:0;border-radius:20px;padding:16px;font-size:22px;font-weight:800;color:#fff;min-height:70px}
.tf .y{background:var(--t);box-shadow:0 5px 0 #1d8a84}.tf .n{background:var(--r);box-shadow:0 5px 0 #b44a40}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:560px;margin:10px auto 0}
.mem button{aspect-ratio:1/1.05;border-radius:14px;border:0;background:linear-gradient(135deg,var(--n),var(--pur));color:#fff;font-family:"Playpen Sans Hebrew",Rubik;font-weight:700;font-size:clamp(14px,3.6vw,21px);padding:4px;line-height:1.3}

.tab th{font-size:clamp(11px,1.8vw,14px);color:var(--g2);font-weight:700;padding:4px 10px}

.bars>div b{position:absolute;top:-24px;width:100%;text-align:center;font-size:15px}
.bars .avg{position:absolute;left:-10px;right:-10px;border-top:3px dashed var(--g);background:none;width:auto}
.coin{width:min(26cqh,12cqw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe7a6,#d9a12e);color:#5a3d00;display:grid;place-items:center;font-weight:800;font-size:clamp(13px,2.4vw,18px);box-shadow:0 3px 0 #a9761a}

svg.v{height:62cqh;width:auto;max-width:100%;direction:ltr;flex:none}

<script>
{

const fmt=s=>autoM(String(s)).replace(/(\d+)\/(\d+)/g,'<span class="fr"><b>$1</b><b>$2</b></span>').replace(/⟦(.*?)⟧/g,'<span class="m">$1</span>');

 title:s=>`<div class="v-title"><div class="k fade">${s.k}</div><h2 class="pop" ${dl(0,.3)}>${fmt(s.h)}</h2></div>`,

 rect:s=>{let o='';for(let r=0;r<s.h;r++)for(let c=0;c<s.w;c++){const on=s.m==='area'||(s.m==='tri'&&c/s.w+(s.h-1-r)/s.h<1-.5/s.w);o+=`<i class="${on?'on pop':''}" ${on?dl(r*s.w+c,.2):''} ${s.m=='per'?'style="background:rgba(43,179,171,.35)"':''}></i>`}return `<div class="row"><div class="lbl fade" style="animation-delay:1s">${s.h}</div><div class="grid" style="grid-template-columns:repeat(${s.w},auto);${s.m=='per'?'outline:4px solid #f5b83d;outline-offset:2px':''}">${o}</div></div><div class="lbl fade" style="animation-delay:1s">${s.w}</div>`},

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const U={'אפס':0,'אחת':1,'אחד':1,'שתיים':2,'שניים':2,'שתי':2,'שני':2,'שלוש':3,'שלושה':3,'שלושת':3,'ארבע':4,'ארבעה':4,'ארבעת':4,'חמש':5,'חמישה':5,'חמשת':5,'שש':6,'שישה':6,'ששת':6,'שבע':7,'שבעה':7,'שבעת':7,'שמונה':8,'שמונת':8,'תשע':9,'תשעה':9,'תשעת':9,'עשר':10,'עשרה':10,'עשרת':10};
const TENS={'עשרים':20,'שלושים':30,'ארבעים':40,'חמישים':50,'שישים':60,'שבעים':70,'שמונים':80,'תשעים':90};
const DEN={'חצי':2,'חצאים':2,'שליש':3,'שלישים':3,'רבע':4,'רבעים':4,'חמישית':5,'חמישיות':5,'שישית':6,'שישיות':6,'שביעית':7,'שביעיות':7,'שמינית':8,'שמיניות':8,'תשיעית':9,'תשיעיות':9,'עשירית':10,'עשיריות':10};
function spokenNums(t){
  t=' '+t.replace(/(\d),(\d{3})/g,'$1$2').replace(/[?!״"׳']/g,' ').replace(/[.,](?!\d)/g,' ').replace(/-/g,' ')+' ';
  if(/גדול/.test(t))return['>'];if(/קטן/.test(t))return['<'];if(/שווה|שווים/.test(t)&&!/\d|אחת|שתיים/.test(t))return['='];
  const toks=t.split(/\s+/).filter(Boolean);const out=[];let cur=null,last=0;
  const push=()=>{if(cur!=null)out.push(cur);cur=null;last=0};
  for(let i=0;i<toks.length;i++){let w=toks[i];
    if(/^\d+(\.\d+)?$/.test(w)){push();cur=Number(w);continue}
    if(/^\d+\/\d+$/.test(w)){push();const[a,b]=w.split('/').map(Number);out.push(a/b);continue}
    if(/^\d+:\d\d$/.test(w)){push();const[a,b]=w.split(':').map(Number);out.push(a+b/60);continue}
    let wv=w.startsWith('ו')&&w.length>2&&(U[w.slice(1)]!=null||TENS[w.slice(1)]||DEN[w.slice(1)]||/^ו(מאה|מאתיים|אלף)$/.test(w))?w.slice(1):w;
    if(wv==='חצי'&&w!==wv&&cur!=null){cur+=.5;continue}if(wv==='רבע'&&w!==wv&&cur!=null){cur+=.25;continue}
    if(DEN[wv]){const d=DEN[wv],pl=/(ים|ות)$/.test(wv);if(pl&&cur!=null){out.push(cur/d);cur=null;last=0}else{push();out.push(1/d)}continue}
    if(wv==='חלקי'&&cur!=null){const nx=toks[i+1];const d=nx&&(/^\d+$/.test(nx)?Number(nx):U[nx]);if(d){out.push(cur/d);cur=null;i++;continue}}
    if(wv==='נקודה'&&cur!=null){const nx=toks[i+1];if(nx&&/^\d+$/.test(nx)){cur=Number(cur+'.'+nx);i++;continue}if(nx&&U[nx]!=null){cur=Number(cur+'.'+U[nx]);i++;continue}}
    if(U[wv]!=null){const nx=toks[i+1];if(nx&&(nx==='עשרה'||nx==='עשר')&&U[wv]<10){cur=(cur||0)+10+U[wv];i++;last=0;continue}cur=(cur||0)+U[wv];last=U[wv];continue}
    if(TENS[wv]){cur=(cur||0)+TENS[wv];last=0;continue}
    if(wv==='מאה'){cur=(cur||0)+100;continue}if(wv==='מאתיים'){cur=(cur||0)+200;continue}
    if(wv==='מאות'&&cur!=null){cur=cur-last+last*100;last=0;continue}
    if(wv==='אלף'||wv==='אלפים'){cur=(cur&&cur>0?cur:1)*1000;continue}if(wv==='אלפיים'){cur=(cur||0)+2000;continue}
    if(wv==='ושארית'||wv==='שארית'){push();continue}
    push();
  }
  push();return out;
}
function optVals(o){o=String(o);if(['>','<','='].includes(o))return[o];
  if(/^\d+:\d\d$/.test(o)){const[a,b]=o.split(':').map(Number);return[a+b/60]}
  if(/ושארית/.test(o))return o.match(/\d+/g).map(Number);
  const m=o.match(/^(\d+) (\d+)\/(\d+)$/);if(m)return[+m[1]+m[2]/m[3]];
  if(/^\d+\/\d+$/.test(o)){const[a,b]=o.split('/').map(Number);return[a/b]}
  const n=o.replace(/,/g,'').match(/-?\d+(\.\d+)?/);return n?[Number(n[0])]:[]}

}

function options(it,gen){const set=new Set([it.a]);let pool=it.o?shuf(it.o):near(it.a);for(const p of pool){if(set.size>=4)break;set.add(String(p))}let g=0;while(set.size<4&&g++<40)set.add(gen().a);return shuf([...set])}
function near(a){const s=String(a);
  if(/^\d+\/\d+$/.test(s)){const[n,d]=s.split('/').map(Number);return shuf([F(n+1,d),F(Math.max(1,n-1),d),F(n,d+1),n+'/'+(d*2),F(d,n)].filter(v=>v!==s))}
  if(/^\d+ \d+\/\d+$/.test(s)){const[w,f]=s.split(' ');const[n,d]=f.split('/').map(Number);return [`${+w+1} ${n}/${d}`,`${w} ${d-n||1}/${d}`,`${Math.max(1,w-1)} ${n}/${d}`]}
  if(/^\d+:\d\d$/.test(s)){const[h,m]=s.split(':').map(Number);return [`${h%12+1}:${String(m).padStart(2,'0')}`,`${h}:${String((m+30)%60).padStart(2,'0')}`,`${(h+10)%12+1}:${String(m).padStart(2,'0')}`]}
  const x=Number(s.replace(/,/g,''));if(isNaN(x))return[];const dec=s.includes('.'),big=Math.abs(x)>=1000,com=s.includes(',');
  const steps=dec?[0.1,1,0.01]:big?[10,100,1000]:x>=50?[1,2,10,5]:[1,2,3];const out=new Set();let g=0;
  while(out.size<6&&g++<60){let w=x+pick(steps)*pick([1,-1]);if(dec)w=Number(fx(w));if(w<0||w===x)continue;out.add(com?C(w):fx(w))}return shuf([...out])}

 balloon(t,key,done){const el=document.getElementById('gm'),gen=()=>t.g(LV);let round=0,sc=0;const N=8,cols=['#e2675b','#2bb3ab','#f0a030','#7c6be0'];

 frog(t,key,done){const el=document.getElementById('gm'),gen=()=>t.g(LV);const N=6;let row=0,mist=0;

   document.getElementById('rd').textContent=row+1;const it=gen();document.getElementById('qq').innerHTML=qHTML(it,'gq');const os=options(it,gen).slice(0,3);if(!os.includes(it.a))os[R(0,2)]=it.a;

     GA.push(setTimeout(()=>{fr.style.transition='none';fr.style.transform='';fr.classList.remove('jump');void fr.offsetWidth;fr.style.transition='';row++;SND.ok();nx()},800))}else{b.classList.add('sink');b.disabled=true;mist++;document.getElementById('ms').textContent=mist;SND.no()}});

 monster(t,key,done){const el=document.getElementById('gm'),gen=()=>t.g(LV);const N=8;let fed=0,sc=0,size=1;

   document.getElementById('rd').textContent=fed+1;const it=gen();let miss=false;document.getElementById('qq').innerHTML=qHTML(it,'gq');const os=options(it,gen);const mo=document.getElementById('mo');mo.innerHTML=mon(true);mo.className='monster';

 tf(t,key,done){const el=document.getElementById('gm'),gen=()=>t.g(LV);const N=10;let n=0,sc=0;

 memory(t,key,done){const el=document.getElementById('gm'),gen=()=>t.g(LV);const items=[],seen=new Set();let g=0;

 race(t,key,done){const el=document.getElementById('gm'),gen=()=>t.g(LV);const T0=LV==1?120:90;let left=T0,sc=0,tr=0;
